<svg xmlns="http://www.w3.org/2000/svg" width="820" height="252" viewBox="-25 -20 2050 630" role="img" aria-labelledby="title desc">
  <title id="title">Zigferencer logo</title>
  <desc id="desc">A stylized amber ferret curls around a tidy KV-cache tile stack, beside the Zigferencer wordmark.</desc>
  
  <g id="ferret-cache-curl">
    <!-- The warm, continuous silhouette and tip of the tail -->
    <path id="coat" fill="#F7A41D" d="
      M 16,300
      C 15,194 81,122 183,86
      C 223,72 264,62 296,46
      C 337,29 388,42 420,79
      C 444,106 454,141 483,181
      L 454,191
      C 437,169 422,143 402,132
      C 375,115 342,117 310,143
      C 276,168 250,204 229,219
      C 143,248 99,326 123,407
      C 145,485 222,516 297,510
      C 379,503 446,437 475,324
      C 468,435 394,526 303,545
      C 240,561 154,551 99,502
      C 43,451 15,383 16,300 Z"/>

    <!-- The full, heavy inner curl. Its outer edge stays visible at tiny sizes. -->
    <path id="curl" fill="#1B1B1B" d="
      M 356,217
      C 294,197 232,203 172,239
      C 108,275 71,325 70,398
      C 68,477 109,542 173,565
      C 242,594 328,580 392,536
      C 452,495 467,416 475,324
      C 463,430 405,491 348,513
      C 285,537 213,532 164,496
      C 116,459 111,408 134,352
      C 173,260 263,218 356,217 Z"/>

    <!-- A clean cut of cream fur, independent from page background. -->
    <path id="muzzle" fill="#FFF9EC" d="
      M 228,201
      C 246,171 267,151 295,151
      C 325,151 349,166 374,174
      C 392,181 403,173 414,170
      C 434,165 452,175 465,188
      C 479,204 471,221 453,229
      C 429,241 401,233 377,216
      C 354,199 330,194 301,192
      C 267,192 245,200 228,201 Z"/>

    <!-- The masked face creates recognition without anatomical detailing. -->
    <path id="face-mask" fill="#1B1B1B" d="
      M 278,148
      C 306,110 336,96 366,105
      C 408,117 439,151 466,188
      C 445,181 436,173 420,178
      C 402,184 392,185 370,176
      C 340,165 312,154 278,148 Z"/>
    <circle id="eye" cx="382" cy="137" r="13" fill="#FFF9EC"/>

    <!-- Solid ear rooted in the crown, never an open loop. -->
    <path id="ear" fill="#1B1B1B" d="
      M 224,93
      C 210,76 212,55 223,40
      C 233,25 251,20 267,23
      C 289,25 304,43 309,67
      C 290,58 275,56 260,61
      C 243,67 232,82 224,93 Z"/>

    <!-- Nose and smile use a contrasting warm color in dark mode. -->
    <path id="smile" fill="#1B1B1B" d="
      M 458,185
      C 465,181 477,185 482,192
      C 483,204 473,221 462,230
      C 439,250 406,248 384,231
      C 373,223 368,213 373,211
      C 376,210 385,217 397,219
      C 425,231 451,220 462,207
      C 459,201 456,191 458,185 Z"/>

    <!-- Strict 3-column grid: 60px cells, 11px gutters, radius 12px. -->
    <g id="cache-tiles">
      <rect fill="#F7A41D" x="309" y="251" width="60" height="60" rx="12"/>
      <g fill="#1B1B1B">
        <rect x="238" y="319" width="60" height="60" rx="12"/>
        <rect x="309" y="319" width="60" height="60" rx="12"/>
        <rect x="167" y="387" width="60" height="60" rx="12"/>
        <rect x="238" y="387" width="60" height="60" rx="12"/>
        <rect x="309" y="387" width="60" height="60" rx="12"/>
      </g>
    </g>
  </g>
